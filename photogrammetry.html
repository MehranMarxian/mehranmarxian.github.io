    <style>
      .photogrammetry-projects {
        --photogrammetry-gap: clamp(8px, 1.2vw, 18px);
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: var(--photogrammetry-gap);
        margin-bottom: var(--photogrammetry-gap);
      }

      .photogrammetry-related {
        min-width: 0;
      }

      .photogrammetry-related__card {
        position: relative;
        display: block;
        aspect-ratio: 1 / 1;
        overflow: hidden;
        color: #ffffff;
        background: #111212;
      }

      .photogrammetry-related__card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 42%;
        transition: filter 220ms ease, transform 320ms ease;
      }

      .photogrammetry-related__card::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.04), rgba(0, 0, 0, 0.72));
        content: "";
      }

      .photogrammetry-related__text {
        position: absolute;
        z-index: 1;
        right: clamp(14px, 2.4vw, 34px);
        bottom: clamp(14px, 2.4vw, 30px);
        left: clamp(14px, 2.4vw, 34px);
      }

      .photogrammetry-related__text h2 {
        margin: 0 0 6px;
        color: #ffffff;
        font-size: clamp(1.4rem, 3vw, 2.8rem);
        font-weight: 400;
      }

      .photogrammetry-related__text p {
        margin: 0;
        color: rgba(255, 255, 255, 0.75);
        font-size: clamp(0.86rem, 1.5vw, 1.05rem);
      }

      .photogrammetry-related__card:hover {
        color: #ffffff;
        text-decoration: none;
      }

      .photogrammetry-related__card:hover img,
      .photogrammetry-related__card:focus img {
        filter: brightness(1.08);
        transform: scale(1.025);
      }

      .project-gallery img {
        object-position: var(--object-position, center);
      }

      .project-page .project-gallery {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(8px, 1.2vw, 18px);
      }

      .project-page .project-gallery .gallery-item,
      .project-page .project-gallery img {
        aspect-ratio: 1 / 1;
      }

      @media (max-width: 767.98px) {
        .project-page .project-gallery {
          grid-template-columns: repeat(4, minmax(0, 1fr));
          gap: 8px;
        }
      }

      @media (max-width: 575.98px) {
        .photogrammetry-projects {
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          margin-bottom: 8px;
        }

        .photogrammetry-related__text {
          right: 8px;
          bottom: 10px;
          left: 8px;
        }

        .photogrammetry-related__text h2 {
          margin-bottom: 3px;
          font-size: clamp(0.92rem, 5vw, 1.2rem);
        }

        .photogrammetry-related__text p {
          font-size: clamp(0.52rem, 2.7vw, 0.68rem);
          line-height: 1.2;
        }
      }
    </style>
